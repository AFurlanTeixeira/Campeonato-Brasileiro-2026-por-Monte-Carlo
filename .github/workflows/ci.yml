name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.0"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr, any::styler

      - name: Lint (lintr)
        run: |
          Rscript -e '
            lints <- lintr::lint_dir(c("R", "scripts", "tests"))
            print(lints)
            if (length(lints) > 0) quit(status = 1, save = "no")
          '
        shell: bash

      - name: Verificar formatação (styler)
        run: Rscript -e 'styler::style_dir(c("R", "scripts", "tests"), dry = "fail")'
        shell: bash
